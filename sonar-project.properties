# SonarCloud analysis settings for the I-Synergy Framework.
# Used by standalone scanners and as documentation for the CI configuration.
sonar.projectKey=I-Synergy_I-Synergy.Framework
sonar.organization=i-synergy-github
sonar.projectName=I-Synergy.Framework

# src/ISynergy.Framework.Mathematics is a port of Math.NET Numerics. The matrix and
# jagged implementations are intentionally parallel, so the duplication between them is
# structural rather than accidental. Exclude the port from copy-paste detection while
# keeping every other metric enabled for that code.
sonar.cpd.exclusions=src/ISynergy.Framework.Mathematics/**

# The Mathematics project is a port of Math.NET Numerics. Its matrix/jagged
# implementations are intentionally parallel and its overload layout mirrors the
# upstream generated sources, so the C# rules below are false positives there:
# S4136 overload adjacency, S107 parameter count, S3241 unused status returns,
# S101 ported type names, S3267 hot numeric loops, and the remaining style rules.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:*
sonar.issue.ignore.multicriteria.e1.resourceKey=src/ISynergy.Framework.Mathematics/**
