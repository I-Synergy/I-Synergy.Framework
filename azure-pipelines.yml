# DEPRECATED — superseded by .github/workflows/ci.yml (GitHub Actions).
# Kept only until the first successful GitHub release; then disable the Azure DevOps pipeline and
# delete this file. See docs/MIGRATION_GUIDE.md, Part 11.

name: $(Date:yyyy).1$(Date:MMdd).1$(Date:HHmm)

trigger:
  branches:
    include:
    - main
  paths:
    exclude:
    - docs/*
    - '*.md'

pr:
  branches:
    include:
    - main
  paths:
    exclude:
    - docs/*
    - '*.md'

variables:
  - name: VersionNumber
    value: ''
  - name: VersionInformational  
    value: ''
  - name: VersionPackage
    value: ''

  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - group: ACC
  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - group: PROD

pool:
  vmImage: 'windows-2025-vs2026'

stages:
  - stage: BuildStage
    displayName: 'Build'
    jobs:
    - job: BuildJob
      displayName: 'Build, test and pack assemblies'
      timeoutInMinutes: 120
      steps:
        - task: PowerShell@2
          displayName: Set Version Variables
          inputs:
            targetType: 'filePath'
            filePath: '$(Build.SourcesDirectory)/scripts/Set-VersionVariables.ps1'
            arguments: '-BuildNumber "$(Build.BuildNumber)" -BuildReason "$(Build.Reason)"'

        - task: Assembly-Info-NetCore@3
          displayName: 'Set Release versions'
          inputs:
            FileNames: |
              src/**/*.csproj
              tests/**/*.csproj
            InsertAttributes: true
            WriteBOM: true
            VersionNumber: '$(VersionNumber)'
            FileVersionNumber: '$(VersionNumber)'
            InformationalVersion: '$(VersionInformational)'
            PackageVersion: '$(VersionPackage)'
            UpdateBuildNumber: '$(VersionPackage)'

        - task: NuGetToolInstaller@1
          displayName: 'Install NuGet 7.9.0'
          inputs:
            versionSpec: 7.9.0

        - task: UseDotNet@2
          displayName: 'Install .Net Sdk'
          inputs:
            packageType: 'sdk'
            useGlobalJson: true
            includePreviewVersions: true

        - task: DotNetCoreCLI@2
          displayName: 'Install MAUI workloads'
          inputs:
            command: custom
            custom: 'workload'
            arguments: 'install maui --source https://api.nuget.org/v3/index.json'

        - task: DotNetCoreCLI@2
          displayName: 'Install Azure SignTool'
          inputs:
            command: 'custom'
            custom: 'tool'
            arguments: 'install --global I-Synergy.Tools.Azure.SignTool'

        # - task: DotNetCoreCLI@2
        #   displayName: 'Install SonarScanner .NET tool'
        #   inputs:
        #     command: 'custom'
        #     custom: 'tool'
        #     arguments: 'install --global dotnet-sonarscanner'

        # - task: CmdLine@2
        #   displayName: 'Begin SonarCloud analysis'
        #   inputs:
        #     script: >
        #       dotnet sonarscanner begin
        #       /o:"i-synergy-github"
        #       /k:"I-Synergy_I-Synergy.Framework"
        #       /n:"I-Synergy.Framework"
        #       /v:"$(VersionPackage)"
        #       /d:sonar.token="$(SonarToken)"
        #       /d:sonar.host.url="https://sonarcloud.io"
        #       /d:sonar.cs.opencover.reportsPaths="$(Agent.TempDirectory)/**/coverage.opencover.xml"

        # Directory.Build.props sets GeneratePackageOnBuild=true for local developer convenience.
        # Packaging in CI is done once, by the dedicated 'Pack I-Synergy Framework' step below
        # (it owns the versioning scheme and packDirectory), so suppress the build-time pack here.
        - task: MSBuild@1
          displayName: 'Build I-Synergy Framework'
          inputs:
            solution: 'I-Synergy.Framework.slnx'
            msbuildArchitecture: 'x64'
            configuration: $(BuildConfiguration)
            msbuildArguments: '/restore /p:Version=$(VersionPackage) /p:ContinuousIntegrationBuild=true /p:GeneratePackageOnBuild=false /nr:false'

        - task: DotNetCoreCLI@2
          displayName: 'Audit for vulnerable packages (direct + transitive)'
          inputs:
            command: 'custom'
            custom: 'list'
            arguments: 'I-Synergy.Framework.slnx package --vulnerable --include-transitive'

        - task: DotNetCoreCLI@2
          displayName: 'Pack I-Synergy Framework'
          inputs:
            command: 'pack'
            packagesToPack: 'src/**/*.csproj'
            nobuild: true
            configuration: $(BuildConfiguration)
            packDirectory: '$(Build.SourcesDirectory)/packages'
            versioningScheme: 'byEnvVar'
            versionEnvVar: 'VersionPackage'
            arguments: '-p:ContinuousIntegrationBuild=true'

        # Fails the run if packaging ever regresses to net10-only assets (e.g. the RC SDK is not
        # resolved and the conditional net11.0 TFMs are silently dropped) or skips a project.
        - task: PowerShell@2
          displayName: 'Verify packages target .NET 10 and .NET 11'
          inputs:
            targetType: 'inline'
            script: |
              $packagesPath = '$(Build.SourcesDirectory)/packages'
              $packages = @(Get-ChildItem -Path $packagesPath -Filter *.nupkg)
              $expected = @(Get-ChildItem -Path '$(Build.SourcesDirectory)/src' -Filter *.csproj -Recurse).Count

              $problems = @()
              if ($packages.Count -ne $expected) {
                $problems += 'Expected ' + $expected + ' package(s) for ' + $expected + ' src project(s), found ' + $packages.Count + '.'
              }

              Add-Type -AssemblyName System.IO.Compression.FileSystem
              foreach ($package in $packages) {
                $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
                try {
                  $entries = @($zip.Entries | ForEach-Object { $_.FullName })
                }
                finally {
                  $zip.Dispose()
                }

                foreach ($tfm in @('net10.0', 'net11.0')) {
                  if (-not ($entries | Where-Object { $_ -like ('lib/' + $tfm + '*/*') })) {
                    $problems += $package.Name + ': missing lib/' + $tfm + ' assets'
                  }
                }
              }

              if ($problems.Count -gt 0) {
                $problems | ForEach-Object { Write-Host ('##vso[task.logissue type=error]' + $_) }
                throw ('Package verification failed with ' + $problems.Count + ' problem(s).')
              }

              Write-Host ('Verified ' + $packages.Count + ' package(s): each contains lib/net10.0* and lib/net11.0* assets.')

        - task: DotNetCoreCLI@2
          displayName: 'Test I-Synergy Framework'
          inputs:
            command: test
            projects: |
              tests/**/*.csproj
              !tests/**/ISynergy.Framework.UI.Maui.Mac.Tests.csproj
            arguments: '--configuration $(BuildConfiguration) --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover'

        - task: CopyFiles@2
          displayName: 'Copy NuGet packages'
          inputs:
            SourceFolder: '$(Build.SourcesDirectory)\packages'
            Contents: '*'
            TargetFolder: '$(Build.ArtifactStagingDirectory)'

        # AzureSignTool is a global tool that targets .NET 10. The pinned .NET 11 SDK step puts only
        # the 11 runtime in the agent's shared x64 dotnet root, so the tool cannot start
        # ("Framework: 'Microsoft.NETCore.App', version '10.0.0'"). Install a 10.x runtime for signing.
        - task: UseDotNet@2
          displayName: 'Install .NET 10 runtime for AzureSignTool'
          inputs:
            packageType: 'runtime'
            version: '10.0.x'

        - task: CmdLine@2
          displayName: 'Sign Nuget packages'
          inputs:
            script: AzureSignTool sign -kvt "$(AzureTenantId)" -kvu "$(KeyVaultUri)" -kvi "$(ClientId)" -kvs "$(ClientSecret)" -kvc "$(CertificateName)" --timestamp-rfc3161 "$(TimeStampUrl)" -td sha256 -v --sign-nuget-contents --sign-nuget-contents-filter "ISynergy.Framework.*" $(Build.ArtifactStagingDirectory)\*.nupkg

        - task: PublishBuildArtifacts@1
          displayName: 'Publish Artifacts'
          inputs:
            pathtoPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: Output
            publishLocation: 'Container'

        # - task: CmdLine@2
        #   displayName: 'End SonarCloud analysis'
        #   inputs:
        #     script: dotnet sonarscanner end /d:sonar.token="$(SonarToken)"

  - stage: Release
    displayName: 'Release'
    dependsOn: BuildStage
    condition: succeeded()
    jobs:
    - job: ArtifactsJob
      displayName: 'Get Nuget artifacts'
      steps:
        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: 'Output'

    - deployment: DeployNuget
      displayName: 'Deploy to NuGet'
      environment: $(Environment)
      dependsOn: ArtifactsJob
      strategy:
        runOnce:
          deploy:
            steps:
              - task: NuGetToolInstaller@1
                displayName: 'Install NuGet 7.9.0'
                inputs:
                  versionSpec: 7.9.0

              - task: NuGetCommand@2
                displayName: 'NuGet push - ISynergy Framework'
                inputs:
                  command: 'push'
                  packagesToPush: '$(Pipeline.Workspace)/Output/*.nupkg'
                  nuGetFeedType: 'external'
                  publishFeedCredentials: 'Nuget.org'

    - job: TagJob
      displayName: 'Create Git Tag'
      dependsOn: DeployNuget
      condition: and(succeeded('DeployNuget'), ne(variables['Build.Reason'], 'PullRequest'))
      steps:
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - task: PowerShell@2
          displayName: 'Create Git Tag'
          inputs:
            targetType: 'filePath'
            filePath: '$(Build.SourcesDirectory)/scripts/New-GitTag.ps1'
            arguments: '-BuildNumber "$(Build.BuildNumber)" -SourceVersion "$(Build.SourceVersion)"'
