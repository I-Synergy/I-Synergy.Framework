# Renders docs/ into the GitHub wiki. See .ai/plans/wiki-docs-sync.md.
# docs/ is the source of truth: pages, links, images and _Sidebar.md are generated, never hand-edited.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/Sync-DocsToWiki.ps1'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

# The wiki is a separate repository (repo.wiki.git); the job token cannot write to it, so the push
# step uses the repository-scoped WIKI_TOKEN secret. Nothing here needs the job token beyond checkout.
permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Render and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WIKI_REPOSITORY: I-Synergy/I-Synergy.Framework
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-check the renderer
        shell: pwsh
        run: ./scripts/Sync-DocsToWiki.ps1 -OutPath "$env:RUNNER_TEMP/wiki" -Check

      # Rendering is a separate step from pushing, so a rendering bug fails the run before anything
      # is written to the live wiki.
      - name: Render wiki pages
        shell: pwsh
        run: >
          ./scripts/Sync-DocsToWiki.ps1
          -OutPath "$env:RUNNER_TEMP/wiki"
          -Repository $env:WIKI_REPOSITORY
          -BaseBranch main

      - name: Push to the wiki repository
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          RENDERED: ${{ runner.temp }}/wiki
          CLONE: ${{ runner.temp }}/wiki-repo
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_TOKEN}" ]; then
            echo "::error::WIKI_TOKEN is empty — see .ai/plans/wiki-docs-sync.md (Token decision)."
            exit 1
          fi

          if ! git clone --depth 1 \
              "https://x-access-token:${WIKI_TOKEN}@github.com/${WIKI_REPOSITORY}.wiki.git" "${CLONE}"; then
            echo "::error::Could not clone ${WIKI_REPOSITORY}.wiki.git — create the wiki's first page (Home) in the UI once."
            exit 1
          fi

          cd "${CLONE}"
          shopt -s nullglob

          # Delete only pages this workflow generated that no longer exist in docs/. Hand-written
          # wiki pages carry no ownership marker and are never touched.
          removed=0
          for page in *.md; do
            if grep -qF '<!-- generated from docs/' "${page}" && [ ! -f "${RENDERED}/${page}" ]; then
              rm -f "${page}"
              removed=$((removed + 1))
            fi
          done

          cp -f "${RENDERED}/"*.md .
          if [ -d "${RENDERED}/images" ]; then
            mkdir -p images
            cp -f "${RENDERED}/images/"* images/ 2>/dev/null || true
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date (${removed} stale page(s) removed)."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: sync from ${SOURCE_SHA:0:7}"
          git push
          echo "Published $(ls -1 "${RENDERED}"/*.md | wc -l) page(s), removed ${removed} stale page(s)."
