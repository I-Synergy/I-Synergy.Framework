# Build, test, pack, sign and publish I-Synergy.Framework.
# Replaces azure-pipelines.yml (Azure DevOps). See docs/MIGRATION_GUIDE.md, Part 11.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  BUILD_CONFIGURATION: ${{ vars.BUILD_CONFIGURATION || 'Release' }}

jobs:
  build:
    name: Build, test and pack
    # A superseded build has no side effects, so a new push cancels it instead of queueing
    # behind it. The release job has its own group and is never cancelled.
    concurrency:
      group: ci-build-${{ github.ref }}
      cancel-in-progress: true
    # ADO used windows-2025-vs2026; fall back to windows-2025 if the preview label is unavailable.
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    outputs:
      buildNumber: ${{ steps.version.outputs.buildNumber }}
      versionPackage: ${{ steps.version.outputs.VersionPackage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set version variables
        id: version
        shell: pwsh
        env:
          BUILD_REASON: ${{ github.event_name == 'pull_request' && 'PullRequest' || 'IndividualCI' }}
        run: |
          $now = Get-Date
          $buildNumber = '{0}.1{1}.1{2}' -f $now.ToString('yyyy'), $now.ToString('MMdd'), $now.ToString('HHmm')
          ./scripts/Set-VersionVariables.ps1 -BuildNumber $buildNumber -BuildReason $env:BUILD_REASON
          Add-Content -Path $env:GITHUB_OUTPUT -Value "buildNumber=$buildNumber"

      # global.json is the single source of truth. The version is read here and installed
      # explicitly: setup-dotnet's own global-json resolution installed a different SDK than the
      # pin, and the verification step below makes any such drift a failed build instead of a
      # silently different toolchain.
      - name: Read .NET SDK version from global.json
        id: sdk
        shell: pwsh
        run: |
          $sdkVersion = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          Write-Host "global.json pins .NET SDK $sdkVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$sdkVersion"

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Verify the installed SDK matches global.json
        shell: pwsh
        env:
          EXPECTED_SDK: ${{ steps.sdk.outputs.version }}
        run: |
          dotnet --list-sdks
          $actual = (dotnet --version).Trim()
          if ($actual -ne $env:EXPECTED_SDK) {
            throw "global.json pins .NET SDK $($env:EXPECTED_SDK), but dotnet resolves $actual. Refusing to build with an SDK the repository does not pin."
          }
          Write-Host "Using the SDK pinned by global.json: $actual"

      - name: Install MAUI workloads
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      # SonarCloud analysis must wrap the build: `begin` injects the MSBuild targets the
      # scanner's analyzers hook into, so it runs before Restore/Build and `end` runs after
      # Test, when the OpenCover reports exist.
      # Automatic Analysis must be OFF in the SonarCloud project; the two analysis methods
      # cannot coexist. Fork PRs get no secrets, so they skip the analysis instead of failing.
      - name: Install Java for SonarScanner
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SonarScanner for .NET
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.0.0
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Begin SonarCloud analysis
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # The Mathematics port is a port of Math.NET Numerics: its matrix/jagged
          # implementations are intentionally parallel. The .NET scanner rejects the
          # multicriteria block from SonarQube.Analysis.xml, so the entries go on the
          # command line (keep in sync with sonar-project.properties).
          $rules = @(
            'S4136', 'S107', 'S3241', 'S3267', 'S1172', 'S3220', 'S3427', 'S101', 'S2325',
            'S1144', 'S1135', 'S4144', 'S1066', 'S1994', 'S4035', 'S2365', 'S1751', 'S3973',
            'S1854', 'S2589', 'S4050', 'S1939', 'S6561', 'S2234', 'S2699',
            'S3776', 'S1192', 'S2436', 'S2342'
          )

          $ids = 1..$rules.Count | ForEach-Object { 'e' + $_ }
          $multicriteria = '/d:sonar.issue.ignore.multicriteria=' + ($ids -join ',')

          $scannerArgs = @(
            'begin',
            '/k:I-Synergy_I-Synergy.Framework',
            '/o:i-synergy-github',
            '/n:I-Synergy.Framework',
            "/v:${{ steps.version.outputs.VersionPackage }}",
            '/d:sonar.host.url=https://sonarcloud.io',
            "/d:sonar.token=$env:SONAR_TOKEN",
            '/d:sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml',
            '/d:sonar.cpd.exclusions=src/ISynergy.Framework.Mathematics/**',
            # Mathematics is a vendored Math.NET port. This branch refactors it wholesale, so
            # new-code coverage on the port would require tests for hundreds of ported routines;
            # its behaviour is covered by its own 954-test suite. The iOS, Mac Catalyst, Android
            # and Tizen heads cannot execute on the Windows CI runner at all. Exclude both from
            # the coverage gate.
            '/d:sonar.coverage.exclusions=src/ISynergy.Framework.Mathematics/**,src/ISynergy.Framework.UI.Maui/Platforms/iOS/**,src/ISynergy.Framework.UI.Maui/Platforms/MacCatalyst/**,src/ISynergy.Framework.UI.Maui/Platforms/Android/**,src/ISynergy.Framework.UI.Maui/Platforms/Tizen/**',
            $multicriteria
          )

          for ($i = 0; $i -lt $rules.Count; $i++) {
            $id = 'e' + ($i + 1)
            $scannerArgs += "/d:sonar.issue.ignore.multicriteria.$id.ruleKey=csharpsquid:$($rules[$i])"
            $scannerArgs += "/d:sonar.issue.ignore.multicriteria.$id.resourceKey=src/ISynergy.Framework.Mathematics/**"
          }

          dotnet sonarscanner @scannerArgs

      # Restore must use the build configuration: in Release the MAUI SDK adds
      # maccatalyst-arm64 to the default runtime identifiers, so a Debug restore leaves
      # the assets file without that target and the Release build fails with NETSDK1047.
      # `dotnet restore` has no -c switch (it would be forwarded to MSBuild and rejected
      # with MSB1001), so the configuration goes through as an MSBuild property.
      - name: Restore
        shell: pwsh
        run: >
          dotnet restore I-Synergy.Framework.slnx
          -p:Configuration=$env:BUILD_CONFIGURATION
          -p:GeneratePackageOnBuild=false
          -nodeReuse:false

      # Directory.Build.props pins AssemblyVersion/FileVersion to 0.0.0.0 and the Azure Pipelines
      # Assembly-Info-NetCore task used to overwrite them from the build number. Passing the
      # properties keeps the assemblies versioned exactly as before.
      - name: Build
        shell: pwsh
        run: >
          dotnet build I-Synergy.Framework.slnx
          -c $env:BUILD_CONFIGURATION
          --no-restore
          -p:Version=${{ steps.version.outputs.VersionPackage }}
          -p:AssemblyVersion=${{ steps.version.outputs.VersionNumber }}
          -p:FileVersion=${{ steps.version.outputs.VersionNumber }}
          -p:InformationalVersion=${{ steps.version.outputs.VersionInformational }}
          -p:PackageVersion=${{ steps.version.outputs.VersionPackage }}
          -p:ContinuousIntegrationBuild=true
          -p:GeneratePackageOnBuild=false
          -nodeReuse:false

      - name: Audit for vulnerable packages
        shell: pwsh
        run: dotnet list I-Synergy.Framework.slnx package --vulnerable --include-transitive

      - name: Pack
        shell: pwsh
        run: >
          dotnet pack I-Synergy.Framework.slnx
          -c $env:BUILD_CONFIGURATION
          --no-build
          -p:Version=${{ steps.version.outputs.VersionPackage }}
          -p:AssemblyVersion=${{ steps.version.outputs.VersionNumber }}
          -p:FileVersion=${{ steps.version.outputs.VersionNumber }}
          -p:InformationalVersion=${{ steps.version.outputs.VersionInformational }}
          -p:PackageVersion=${{ steps.version.outputs.VersionPackage }}
          -p:ContinuousIntegrationBuild=true
          -o packages

      - name: Verify packages target .NET 10 and .NET 11
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path 'packages' -Filter *.nupkg)
          $expected = @(Get-ChildItem -Path 'src' -Filter *.csproj -Recurse).Count
          $problems = @()
          if ($packages.Count -ne $expected) {
            $problems += "Expected $expected package(s) for $expected src project(s), found $($packages.Count)."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($package in $packages) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try { $entries = @($zip.Entries | ForEach-Object { $_.FullName }) } finally { $zip.Dispose() }
            foreach ($tfm in @('net10.0', 'net11.0')) {
              if (-not ($entries | Where-Object { $_ -like "lib/$tfm*/*" })) {
                $problems += "$($package.Name): missing lib/$tfm assets"
              }
            }
          }
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            throw "Package verification failed with $($problems.Count) problem(s)."
          }
          Write-Host "Verified $($packages.Count) package(s): each contains lib/net10.0* and lib/net11.0* assets."

      - name: Test
        shell: pwsh
        run: |
          $failed = @()
          $projects = Get-ChildItem -Path 'tests' -Filter *.csproj -Recurse |
            Where-Object { $_.Name -ne 'ISynergy.Framework.UI.Maui.Mac.Tests.csproj' }
          foreach ($project in $projects) {
            Write-Host "::group::$($project.Name)"
            dotnet test $project.FullName `
              -c $env:BUILD_CONFIGURATION `
              --no-build `
              --collect:"XPlat Code Coverage" `
              --results-directory TestResults `
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
            if ($LASTEXITCODE -ne 0) { $failed += $project.Name }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) { throw "Test failures in: $($failed -join ', ')" }

      # Runs on failure too, so the partial analysis is uploaded instead of leaving the
      # project stuck in its previous state.
      - name: End SonarCloud analysis
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token=$env:SONAR_TOKEN

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v5
        with:
          name: nupkgs
          path: |
            packages/*.nupkg
            packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish ${{ github.event_name == 'pull_request' && 'preview' || 'release' }} packages
    needs: build
    # Never cancel a job that may be mid-push to NuGet.org or mid-release: queue instead.
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    # PR builds publish signed -preview packages through `acceptance`; main publishes release
    # packages through `production`, which carries the approval gate. Fork PRs get no secrets.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2025
    environment: ${{ github.event_name == 'pull_request' && 'acceptance' || 'production' }}
    timeout-minutes: 60
    permissions:
      contents: write   # push the release tag
      id-token: write   # OIDC to Azure Key Vault and nuget.org
    steps:
      # GITHUB_TOKEN is an installation token of the GitHub Actions App, and an App token may only
      # create a ref whose commit touches .github/workflows/ when it holds the `workflows`
      # permission — which GITHUB_TOKEN can never be granted. Checkout therefore authenticates
      # with RELEASE_TOKEN (fine-grained PAT: Contents and Workflows read/write), and its persisted
      # credential is what New-GitTag.ps1 pushes with. GITHUB_TOKEN stays the fallback so a
      # repository without the secret still releases commits that do not change a workflow file.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # No .NET SDK is installed in this job. It builds nothing: the packages come from the
      # `build` job's artifact, the signing tool ships self-contained, and tagging/releasing use
      # git and gh. `dotnet tool install` / `dotnet nuget push` only need a CLI, which the
      # windows image already provides; they run from RUNNER_TEMP because global.json pins
      # 11.0.100 for building and the pin is irrelevant here.
      #
      # The tool is packed self-contained per RID (AzureSignTool.Cli.<rid> plus a pointer
      # package), so it bundles its own runtime and no .NET runtime has to be installed. The
      # version stays pinned deliberately: a tool release cannot silently change what signs a
      # published package.
      - name: Install Azure SignTool
        shell: pwsh
        run: |
          $version = '2026.11111.11200'
          # A per-job tool path, not --global: a persistent runner profile may already carry an
          # earlier version (e.g. 2026.11027.11159, which is framework-dependent), and the signing
          # step must run the pinned one.
          $toolPath = Join-Path $env:RUNNER_TEMP 'signing-tool'
          if (Test-Path $toolPath) { Remove-Item -Path $toolPath -Recurse -Force }

          Push-Location $env:RUNNER_TEMP
          try {
            $cli = [version]((dotnet --version).Trim())
            Write-Host "Installing with the image's .NET CLI $cli"
            if ($cli.Major -lt 10) {
              throw "AzureSignTool.Cli needs a .NET 10 or later CLI to install; the image provides $cli."
            }
            # Package renamed from I-Synergy.Tools.Azure.SignTool to AzureSignTool.Cli; the command
            # is still `AzureSignTool`.
            dotnet tool install AzureSignTool.Cli --version $version --tool-path $toolPath
            if ($LASTEXITCODE -ne 0) { throw 'AzureSignTool.Cli install failed.' }

            $listed = (dotnet tool list --tool-path $toolPath |
              Select-String -SimpleMatch 'azuresigntool.cli' |
              ForEach-Object { $_.ToString().Trim() }) -join ' '
            if ($listed -notmatch [regex]::Escape($version)) {
              throw "The installed tool is not AzureSignTool.Cli $version ('$listed')."
            }
            Write-Host "Installed $listed"
          }
          finally {
            Pop-Location
          }
          Add-Content -Path $env:GITHUB_PATH -Value $toolPath

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: nupkgs
          path: packages

      # Signing only touches the Key Vault data plane, and the identity has a vault access policy,
      # not a subscription role — so there is no `az login` and no subscription at all. GitHub issues
      # the OIDC token (id-token: write) and WorkloadIdentityCredential exchanges it for a vault token.
      - name: Fetch OIDC token for Key Vault
        shell: pwsh
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          $tokenFile = Join-Path $env:RUNNER_TEMP 'azure-federated-token'
          $response = Invoke-RestMethod `
            -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          Set-Content -Path $tokenFile -Value $response.value -NoNewline -Encoding utf8NoBOM
          @(
            "AZURE_CLIENT_ID=$env:CLIENT_ID"
            "AZURE_TENANT_ID=$env:TENANT_ID"
            "AZURE_AUTHORITY_HOST=https://login.microsoftonline.com/"
            "AZURE_FEDERATED_TOKEN_FILE=$tokenFile"
          ) | Add-Content -Path $env:GITHUB_ENV

      - name: Sign NuGet packages
        shell: pwsh
        env:
          KEY_VAULT_URI: ${{ vars.AZURE_KEYVAULT_URI }}
          SIGNING_CERTIFICATE: ${{ vars.AZURE_SIGNING_CERTIFICATE }}
          TIMESTAMP_URL: ${{ vars.TIMESTAMP_URL }}
        run: |
          AzureSignTool sign `
            -kvu "$env:KEY_VAULT_URI" `
            -kvc "$env:SIGNING_CERTIFICATE" `
            -act WorkloadIdentityCredential `
            --timestamp-rfc3161 "$env:TIMESTAMP_URL" `
            -td sha256 -v `
            --sign-nuget-contents `
            --sign-nuget-contents-filter "ISynergy.Framework.*" `
            (Get-ChildItem -Path 'packages' -Filter *.nupkg).FullName

      - name: NuGet login (trusted publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        shell: pwsh
        run: |
          # `dotnet nuget push` uses the image's CLI, so it runs from RUNNER_TEMP: inside the
          # repository global.json would demand the pinned 11.0.100 SDK, which this job does not
          # install because it builds nothing.
          $packages = @(Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'packages') -Filter *.nupkg)
          Push-Location $env:RUNNER_TEMP
          try {
            Write-Host "Pushing $($packages.Count) package(s) with .NET CLI $(& dotnet --version)"
            foreach ($package in $packages) {
              dotnet nuget push $package.FullName `
                --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} `
                --source https://api.nuget.org/v3/index.json `
                --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $($package.Name)" }
            }
          }
          finally {
            Pop-Location
          }

      - name: Create git tag
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.buildNumber }}
          SOURCE_VERSION: ${{ github.sha }}
        run: >
          ./scripts/New-GitTag.ps1
          -BuildNumber $env:BUILD_NUMBER
          -SourceVersion $env:SOURCE_VERSION
          -UserEmail 'github-actions[bot]@users.noreply.github.com'
          -UserName 'github-actions[bot]'

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          BUILD_NUMBER: ${{ needs.build.outputs.buildNumber }}
          VERSION_PACKAGE: ${{ needs.build.outputs.versionPackage }}
        run: |
          gh release create "v$env:BUILD_NUMBER" `
            --title "v$env:BUILD_NUMBER" `
            --notes "NuGet packages published as ``$env:VERSION_PACKAGE``." `
            --generate-notes `
            --verify-tag
