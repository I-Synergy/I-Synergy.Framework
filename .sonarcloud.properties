# SonarQube Cloud automatic analysis configuration.
#
# Automatic analysis does NOT read sonar-project.properties. This file is the only
# repository-side configuration it honors, and only for the keys documented at
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/
#
# Configured in the SonarQube Cloud UI instead (project > Administration > General
# Settings > Analysis scope), because automatic analysis ignores scanner arguments
# and the keys below are not supported in this file:
#   - sonar.issue.ignore.multicriteria.* (the 25 Mathematics rule exclusions)
#   - coverage import (automatic analysis does not support coverage)
#   - external Roslyn analyzer reports (automatic analysis does not support them)

# src/ISynergy.Framework.Mathematics is a port of Math.NET Numerics. The matrix and
# jagged implementations are intentionally parallel, so the duplication between them
# is structural rather than accidental. Exclude the port from copy-paste detection
# while keeping every other metric enabled for that code.
sonar.cpd.exclusions=src/ISynergy.Framework.Mathematics/**
